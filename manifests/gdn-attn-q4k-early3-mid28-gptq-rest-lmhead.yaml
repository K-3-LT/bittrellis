schema: bittrellis/manifest@2
track: HPC-01
name: gdn-attn-q4k-early3-mid28-gptq-rest-lmhead
authors:
- K-3-LT
description: >
  Retain our merged PR84 execution formats and fixed Q4_K MLP windows at layers
  1-3 and 28-31. Regenerate the other 57 native MLP blocks with main's approved
  nvfp4_gptq@v1 using the pinned hpc01-e6 gate/up calibration statistics; its
  down projection fallback remains nvfp4_blockfit@v1. Keep recurrent, attention
  and lm_head encodings unchanged. Test whether the independent byte change
  fills the residual low-memory fidelity gap beyond the current full frontier.
default: NVFP4
rules:
- match: L*.mlp
  format: NVFP4
  quantizer: nvfp4_gptq
- match: L*.gdn.*
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.gdn.*
  layers: 1-63
  format: Q4_K
- match: L*.attn.*
  format: Q4_K
- match: L*.mlp
  layers: 1-3
  format: Q4_K
- match: L*.mlp
  layers: 28-31
  format: Q4_K
modules:
  lm_head: Q4_K

