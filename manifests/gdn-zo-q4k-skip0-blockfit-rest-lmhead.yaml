schema: bittrellis/manifest@2
track: HPC-01
name: gdn-zo-q4k-skip0-blockfit-rest-lmhead
authors:
- K-3-LT
description: Keep recurrent qkv and every MLP/attention projection at merged blockfit
  NVFP4. Fit recurrent z/out after layer 0 and lm_head directly from BF16 as Q4_K.
  Test whether partial recurrent conversion creates a quality/memory trade-off without
  disabling native qkv prefill.
default: NVFP4
rules:
- match: L*.mlp
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.attn.*
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.gdn.*
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.gdn.z
  layers: 1-63
  format: Q4_K
- match: L*.gdn.out
  layers: 1-63
  format: Q4_K
modules:
  lm_head: Q4_K
