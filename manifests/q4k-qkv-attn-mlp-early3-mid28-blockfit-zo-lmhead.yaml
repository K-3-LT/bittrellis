schema: bittrellis/manifest@2
track: HPC-01
name: q4k-qkv-attn-mlp-early3-mid28-blockfit-zo-lmhead
authors: [K-3-LT]
description: Retain merged PR84's seven Q4_K MLP placements and all Q4_K
  attention. Use merged main blockfit on recurrent z/out and layer zero,
  with Q4_K only on recurrent qkv in layers 1-63 as in merged PR86.
  This single fixed recipe tests projection-specific recurrence fidelity
  at the existing sparse MLP memory trade-off; no calibration or layer scan.
default: NVFP4
rules:
- match: L*.mlp
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.gdn.*
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.gdn.qkv
  layers: 1-63
  format: Q4_K
- match: L*.attn.*
  format: Q4_K
- match: L*.mlp
  layers: 1-3
  format: Q4_K
- match: L*.mlp
  layers: 28-31
  format: Q4_K
modules:
  lm_head: Q4_K
